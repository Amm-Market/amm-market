name: gitleaks

on:
  push:
  pull_request:
  workflow_dispatch:

# Runs the open-source gitleaks CLI directly (MIT licensed, free).
# The gitleaks-action wrapper requires a paid license for org-owned
# repos, so we invoke the binary ourselves instead.
jobs:
  scan:
    name: Scan for secrets
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan full history for secrets
        run: |
          gitleaks git \
            --log-opts="--all" \
            --redact=100 \
            --exit-code=1 \
            --verbose \
            .
